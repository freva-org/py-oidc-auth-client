[build-system]
requires = ["flit_core >=3.2", "appdirs"]
build-backend = "flit_core.buildapi"
[project]
name = "py-oidc-auth-client"
description = "Client library for the OIDC Auth server."
authors = [{name = "DKRZ, Clint", email = "freva@dkrz.de"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "httpx",
    "platformdirs",
    "rich",
    "typing_extensions",
]
[project.urls]
Documentation = "https://py-oidc-auth-client.readthedocs.io"
Issues = "https://github.com/freva-org/py-oidc-auth-client/issues"
Source = "https://github.com/freva-org/py-oidc-auth-client/"
[project.scripts]
oidc-auth = "py_oidc_auth_client.__main__:main"

[project.optional-dependencies]
dev = ["rust-just",
       "validate-pyproject[all]",
       "flit",
       "twine",
       "py-oidc-auth-client[tests,lint,docs,keys]",
       ]
cli = ["rich-argparse"]
# private_key_jwt client authentication for plain OpenID Connect providers
keys = ["PyJWT[crypto]"]
tests = ["pytest",
         "pytest-env",
         "mock",
         "pytest-mock",
         "pytest-cov",
         "pytest-asyncio",
         "requests",
         "uvicorn",
         "fastapi",
         "python-multipart",
         "pytest-timeout",
         "pytest-xdist",
         "PyJWT[crypto]",
         ]
lint = ["black",
        "isort",
        "flake8",
        "pytest-stub",
        "pydocstyle",
        "codespell",
        "bandit[toml]",
        "mypy",
        ]
docs = ["sphinx-execute-code-python3",
        "sphinx-code-tabs",
        "sphinx-copybutton",
        "sphinx-sitemap",
        "sphinx-togglebutton",
        "sphinxcontrib-httpdomain",
        "sphinxext-opengraph",
        "sphinx-design",
        "pydata-sphinx-theme"
        ]
# flit ships every file inside the package directory, so py.typed needs
# no declaration here.  It does need to exist: see src/py_oidc_auth_client/py.typed.



[tool.pytest.ini_options]
log_cli = false
log_cli_level = "ERROR"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
# A blanket "ignore::UserWarning" would hide the warnings this library
# raises for unsupported grant parameters, so filter by origin instead.
filterwarnings = [
    "error::UserWarning",
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
    "ignore::DeprecationWarning:starlette",
]
timeout = 60

# flake8 does not read pyproject.toml.  Its options live in .flake8 so
# that a bare "flake8" matches what CI runs.
[tool.pydocstyle]
add_ignore = ["D107", "D205", "D102", "D400"]

[tool.mypy]
files = "src"
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
install_types = true
non_interactive = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
ignore_missing_imports = true
allow_untyped_calls = true

[tool.isort]
known_first_party = ["py_oidc_auth_client"]
profile = "black"
line_length = 79
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]


[tool.coverage.run]
branch = true
source = ["py_oidc_auth_client"]

[tool.coverage.report]
# Deliberately short.  Excluding "except OSError" and "except Exception"
# hid 25 statements of error handling from the report, which is exactly
# the code least likely to be exercised by accident.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == '__main__':",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
