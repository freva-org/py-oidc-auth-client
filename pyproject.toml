[build-system]
requires = ["flit_core >=3.2", "appdirs"]
build-backend = "flit_core.buildapi"
[project]
name = "py-oidc-auth-client"
description = "Client library for the OIDC Auth server."
authors = [{name = "DKRZ, Clint", email = "freva@dkrz.de"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "httpx",
    "platformdirs",
    "rich",
    "typing_extensions",
]
[project.urls]
Documentation = "https://py-oidc-auth-client.readthedocs.io"
Issues = "https://github.com/freva-org/py-oidc-auth-client/issues"
Source = "https://github.com/freva-org/py-oidc-auth-client/"
[project.scripts]
oidc-auth = "py_oidc_auth_client.__main__:main"

[project.optional-dependencies]
dev = ["tox", "cryptography", "uvicorn", "py-oidc-auth[fastapi,tests]"]
cli = ["rich-argparse"]
tests = ["pytest",
         "pytest-env",
         "mock",
         "pytest-mock",
         "pytest-cov",
         "pytest-asyncio",
         "requests",
         "uvicorn",
         "fastapi",
         "python-multipart",
         "pytest-timeout",
         "pytest-xdist",
         "PyJWT[crypto]",
         ]
docs = ["sphinx-execute-code-python3",
        "sphinx-code-tabs",
        "sphinx-copybutton",
        "sphinx-sitemap",
        "sphinx-togglebutton",
        "sphinxcontrib-httpdomain",
        "sphinxext-opengraph",
        "sphinx-design",
        "pydata-sphinx-theme"
        ]
# flit ships every file inside the package directory, so py.typed needs
# no declaration here.  It does need to exist: see src/py_oidc_auth_client/py.typed.



[tool.pytest.ini_options]
log_cli = false
log_cli_level = "ERROR"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
# A blanket "ignore::UserWarning" would hide the warnings this library
# raises for unsupported grant parameters, so filter by origin instead.
filterwarnings = [
    "error::UserWarning",
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
    "ignore::DeprecationWarning:starlette",
]
timeout = 60

# flake8 does not read pyproject.toml.  Its options live in .flake8 so
# that a bare "flake8" matches what CI runs.
[tool.pydocstyle]
add_ignore = ["D107", "D205", "D102", "D400"]

[tool.mypy]
files = "src"
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
install_types = true
non_interactive = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
ignore_missing_imports = true
allow_untyped_calls = true

[tool.isort]
known_first_party = ["py_oidc_auth_client"]
profile = "black"
line_length = 79
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]


[tool.coverage.run]
branch = true
source = ["py_oidc_auth_client"]

[tool.coverage.report]
# Deliberately short.  Excluding "except OSError" and "except Exception"
# hid 25 statements of error handling from the report, which is exactly
# the code least likely to be exercised by accident.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == '__main__':",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.tox]
legacy_tox_ini = """
[tox]
min_version = 4.0
# "test" is in the default list so a bare `tox` runs it.  CI still calls
# `tox -e test` per Python version in its own matrix job.
env_list = docs, lint, types, pkg
passenv = *
[testenv]
passenv = *
parallel_show_output = false
[testenv:test]
description = "Run the unit tests."
extras = tests
commands =
    python3 -m pytest -vv --cov=py_oidc_auth_client --cov-report=html:coverage_report --junitxml report.xml --cov-report xml tests/
    python3 -m coverage report --fail-under=100 --precision=2 --show-missing
[testenv:docs]
description = "Create the documentation."
extras = docs
deps = codespell
allowlist_externals = make
                      codespell
# -W turns Sphinx warnings into errors: a broken cross reference or a
# page missing from a toctree currently passes CI silently.
setenv = SPHINXOPTS = -W --keep-going
commands = codespell {posargs: --quiet-level=2} docs/source
           make -C docs clean
           make -C docs html

[testenv:linkcheck]
description = "Check that documentation links still resolve."
extras = docs
allowlist_externals = make
commands = make -C docs linkcheck

[testenv:lint]
description = "Check code quality."
deps = -e .
       black
       isort
       flake8
       pytest-stub
       pydocstyle
       codespell
       bandit[toml]
commands =
    # black was installed but never invoked, so formatting was unchecked.
    python3 -m black --check --diff --line-length 79 src tests
    python3 -m isort --check --diff src tests
    python3 -m flake8 src tests --count --statistics --show-source
    codespell {posargs: --quiet-level=2} src/ tests/
    python3 -m pydocstyle src/py_oidc_auth_client
    bandit -r src/py_oidc_auth_client --severity-level medium --confidence-level high

[testenv:format]
description = "Apply the formatting that lint checks."
deps = black
       isort
commands =
    python3 -m black --line-length 79 src tests
    python3 -m isort src tests
[testenv:types]
description = "Static type checking."
deps = .
       mypy
       pytest-stub
commands = python3 -m mypy --install-types --non-interactive

[testenv:pkg]
description = "Validate packaging metadata before it reaches PyPI."
skip_install = true
deps = validate-pyproject[all]
       flit
       twine
allowlist_externals = rm
# A misspelled key under [project] is silently ignored by the build
# backend: that is how the classifiers went missing from 2603.0.1.
commands =
    python3 -m validate_pyproject pyproject.toml
    python3 -m flit build
    python3 -m twine check dist/*
    python3 -c "import zipfile, glob, sys; w = glob.glob('dist/*.whl')[0]; z = zipfile.ZipFile(w); m = [n for n in z.namelist() if n.endswith('METADATA')][0]; t = z.read(m).decode(); assert 'Classifier: Programming Language :: Python :: 3.' in t, 'no Python version classifiers in wheel metadata'; assert any(n.endswith('py.typed') for n in z.namelist()), 'py.typed missing from wheel'; print('wheel metadata ok')"
commands_post = rm -rf dist
[testenv:release]
description = "Bump a new version."
deps = git-python
       packaging
       requests
       tomli
commands = python3 bump.py tag py_oidc_auth_client
allowlist_externals = rm
                      curl
commands_pre = curl -H 'Cache-Control: no-cache' -Ls -o bump.py https://raw.githubusercontent.com/freva-org/freva-admin/main/release.py
commands_post = rm bump.py
"""
